apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-test
  template:
    metadata:
      labels:
        app: spring-test
    spec:
      containers:
        - name: spring-test
          image: spring-test:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: spring-test
spec:
  type: NodePort
  selector:
    app: spring-test
  ports:
    - port: 8080
      targetPort: 8080
